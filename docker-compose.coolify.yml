# Deploy via Coolify (build pack "Docker Compose").
#   Compose file: /docker-compose.coolify.yml
#   Domínio: definir no serviço "frontend" (porta 80) pelo painel do Coolify.
# Diferenças para o docker-compose.prod.yml:
#   - sem "ports": quem publica o frontend é o proxy do Coolify (Traefik);
#   - segredos gerados pelo Coolify (SERVICE_PASSWORD_*), editáveis no painel.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: transynex
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: transynex
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U transynex -d transynex']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  libretranslate:
    image: libretranslate/libretranslate
    restart: unless-stopped
    environment:
      # Idiomas carregados (vazio = todos, ~5 GB e bem mais RAM). Ex.: en,pt,ja,ko,zh
      LT_LOAD_ONLY: ${LT_LOAD_ONLY:-}
    volumes:
      - libretranslate-data:/home/libretranslate/.local

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://transynex:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/transynex
      REDIS_URL: redis://redis:6379
      LIBRETRANSLATE_URL: http://libretranslate:5000
      TRANSYNEX_STORAGE_DIR: /data/storage
      TRANSYNEX_MODELS_DIR: /data/models/tesseract
      JWT_SECRET: ${SERVICE_PASSWORD_64_JWT}
      MASTER_KEY: ${SERVICE_PASSWORD_64_MASTERKEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
    volumes:
      - backend-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    expose:
      - '80'
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:
  libretranslate-data:
  backend-data:
